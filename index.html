<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="SchoolDesk — Manage students, fees, parents & teachers all in one app">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SchoolDesk">
  <title>SchoolDesk - School Manager</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="app" style="display: none;">
    <!-- Branding Top Bar -->


    <!-- Header -->
    <header class="app-header" style="position: relative; justify-content: center; display: flex; align-items: center; width: 100%;">
      <!-- Left side items -->
      <div class="header-left" style="position: absolute; left: 16px;">
        <button class="back-btn" id="back-btn" style="display:none" onclick="goBack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
      </div>

      <!-- Center item -->
      <div class="header-center" style="display: flex; align-items: center; text-align: center;">
        <div id="header-school-name" style="font-size: 1.25rem; font-weight: 800; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50vw; letter-spacing: 0.5px;">SchoolDesk</div>
        <h1 id="page-title" style="display:none;"></h1>
      </div>

      <!-- Right side items -->
      <div class="header-right" style="position: absolute; right: 16px; display: flex; gap: 8px;">
        <button class="header-action theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">
          <svg class="theme-icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
          <svg class="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button class="header-action desktop-only" id="switch-account-btn" onclick="window.showAccountSwitcher && window.showAccountSwitcher()" title="Switch Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
          </svg>
        </button>
        <button class="header-action desktop-only" id="logout-btn" onclick="window.logout && window.logout()" title="Log Out" style="color: var(--accent-danger);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content" id="app-content">
      <!-- Pages rendered by JavaScript -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="students" onclick="navigate('students')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87"/>
          <path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
        <span>Students</span>
      </button>
      <button class="nav-item" data-page="fees" onclick="navigate('fees')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
        </svg>
        <span>Fees</span>
      </button>
      <button class="nav-item" data-page="teachers" onclick="navigate('teachers')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
        </svg>
        <span>Teachers</span>
      </button>
      <button class="nav-item" data-page="settings" onclick="navigate('settings')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModalOverlay(event)">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>

  <!-- Auth Script -->
  <script type="module">
    import { supabase } from "./js/supabase.js";
    import { logout, showAccountSwitcher } from "./js/auth.js";

    // Expose for onclick handlers
    window.logout = async () => {
      const ok = await confirmAction('Are you sure you want to log out and clear your cached data?');
      if (ok) await logout();
    };
    window.showAccountSwitcher = showAccountSwitcher;

    window.updateSchoolName = async (newName) => {
      const schoolId = localStorage.getItem('currentSchoolId');
      if (!schoolId) return false;
      const { error } = await supabase.from('schools').update({ name: newName }).eq('id', schoolId);
      if (error) {
        console.error('Error updating school name:', error);
        return false;
      }
      
      // Update auth user metadata
      await supabase.auth.updateUser({
        data: { school_name: newName }
      });
      
      // Update offline accounts cache
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        const accounts = JSON.parse(localStorage.getItem('offlineAccounts') || '{}');
        if (accounts[user.id]) {
          accounts[user.id].schoolName = newName;
          localStorage.setItem('offlineAccounts', JSON.stringify(accounts));
        }
      }
      return true;
    };

    // Check Session
    const checkSession = async () => {
      const storedSchoolId = localStorage.getItem('currentSchoolId');
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session || !storedSchoolId) {
        location.href = "login.html";
      } else {
        document.getElementById('app').style.display = 'flex';
        if (window.syncFromSupabase) {
          window.syncFromSupabase();
        }
      }
    };
    
    checkSession();
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>

</body>
</html>
