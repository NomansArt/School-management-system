<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SchoolDesk - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.login-page {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg-primary);
      margin: 0;
      padding: 20px;
    }
    
    .login-card {
      background: var(--bg-secondary);
      padding: 40px 30px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .login-card h1 {
      margin-top: 0;
      margin-bottom: 5px;
      color: var(--text-primary);
      font-size: 1.8rem;
    }

    .login-card p {
      color: var(--text-secondary);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .login-form {
      text-align: left;
    }

    .login-form label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .login-form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 1rem;
    }

    .login-form input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 600;
      border: none;
      transition: all 0.2s;
    }

    .btn.primary {
      background: var(--accent-primary);
      color: white;
    }

    .btn.primary:hover {
      background: var(--accent-hover);
    }

    .btn.secondary {
      background: transparent;
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }
    
    .btn.secondary:hover {
      background: rgba(79, 70, 229, 0.1);
    }

    .alert {
      padding: 12px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: block;
    }
    
    .alert.success {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: block;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-card">
    <h1>SchoolDesk</h1>
    <p>Sign in to manage your school</p>

    <div id="alert-box" class="alert"></div>

    <form id="login-form" class="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="admin@school.com">

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">

      <label for="school-name">School Name</label>
      <input type="text" id="school-name" required placeholder="e.g. Springfield High">

      <div class="action-group">
        <button type="submit" class="btn primary" id="login-btn">Log In</button>
        <button type="button" id="signup-btn" class="btn secondary">Create New Account</button>
      </div>
    </form>
  </div>

  <!-- Load Supabase from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script type="module">
    import { signIn, signUp } from "./js/supabase.js";

    const form = document.getElementById('login-form');
    const signupBtn = document.getElementById('signup-btn');
    const loginBtn = document.getElementById('login-btn');
    const alertBox = document.getElementById('alert-box');

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = 'alert ' + type;
    }

    function setLoading(isLoading) {
      const inputs = form.querySelectorAll('input, button');
      inputs.forEach(el => el.disabled = isLoading);
      loginBtn.textContent = isLoading ? 'Loading...' : 'Log In';
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const pwd   = document.getElementById('password').value;
      const school = document.getElementById('school-name').value.trim();

      setLoading(true);
      try {
        await signIn(email, pwd, school);
        showAlert('Login successful!', 'success');
        setTimeout(() => {
            location.href = "index.html";
        }, 500);
      } catch (err) {
        showAlert(err.message || 'Login failed', 'error');
        setLoading(false);
      }
    });

    signupBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const pwd   = document.getElementById('password').value;
      const school = document.getElementById('school-name').value.trim();

      if (!email || !pwd || !school) {
        showAlert('Please fill all fields to sign up', 'error');
        return;
      }

      setLoading(true);
      try {
        await signUp(email, pwd, school);
        showAlert('Account created! Logging you in...', 'success');
        setTimeout(() => {
            location.href = "index.html";
        }, 1500);
      } catch (err) {
        showAlert(err.message || 'Sign-up failed', 'error');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
